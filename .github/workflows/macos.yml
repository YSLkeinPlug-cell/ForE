name: macOS build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run core logic tests
        run: swift test
      - name: Build local macOS app bundle
        run: bash scripts/build-app.sh
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent 'build/ForE ScreenTime.app' 'build/ForE-ScreenTime-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: ForE-ScreenTime-macOS
          path: build/ForE-ScreenTime-macOS.zip
